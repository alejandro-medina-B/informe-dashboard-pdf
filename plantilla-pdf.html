        text-align: center;

    .tarjetas {

    .tarjeta {

    }

    .tarjeta h3 {

    .valor {

        font-weight: 700;

    }

    .texto {

    }

    .azul { background: #1e3a8a; }
    .gris { background: #4b5563; }
    .verde { background: #059669; }
    .rojo { background: #b91c1c; }
    .naranja { background: #ea580c; }

    .footer {

        font-size: 14px;
        color: #6b7280;
        margin-top: 40px;
        padding-bottom: 20px;
    }
</style>
</head>
