<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Informe Dashboard PDF</title>
    <link rel="stylesheet" href="styles.css">

    <!-- Librería para generar PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>

    <h2>Informe Ejecutivo</h2>
    <p>Datos cargados desde AppSheet</p>

    <button id="btnPDF">Generar PDF</button>

    <div id="content">

        <h3>Dashboard Ejecutivo</h3>
        <p><strong>Fecha Inicial:</strong> <span id="fechaInicial"></span></p>
        <p><strong>Fecha Final:</strong> <span id="fechaFinal"></span></p>
        <p><strong>Usuario:</strong> <span id="usuario"></span></p>
        <p><strong>Total Oportunidades:</strong> <span id="totalOportunidades"></span></p>
        <p><strong>Actividades:</strong> <span id="actividades"></span></p>
        <p><strong>Eficiencia Global:</strong> <span id="eficienciaGlobal"></span></p>
        <p><strong>Eficiencia Seguimiento:</strong> <span id="eficienciaSeguimiento"></span></p>
        <p><strong>Eficiencia Cierre:</strong> <span id="eficienciaCierre"></span></p>
        <p><strong>Eficiencia Trabajo:</strong> <span id="eficienciaTrabajo"></span></p>
        <p><strong>Tiempo Invertido:</strong> <span id="tiempoInactividad"></span></p>
        <p><strong>Ritmo:</strong> <span id="ritmo"></span></p>
        <p><strong>Tasa de Éxito:</strong> <span id="tasaExito"></span></p>
        <p><strong>Velocity:</strong> <span id="velocity"></span></p>
        <p><strong>Momentum:</strong> <span id="momentum"></span></p>

    </div>

    <script src="app.js"></script>

</body>
</html>
